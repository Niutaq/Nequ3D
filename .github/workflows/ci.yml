name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Wails Bindings, TypeScript & Vite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: nequ3d-app/go.mod
          cache-dependency-path: nequ3d-app/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nequ3d-app/frontend/package-lock.json
      - name: Generate Wails TypeScript bindings
        working-directory: nequ3d-app
        run: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0 generate bindings -ts
      - name: Install, typecheck, and build frontend
        working-directory: nequ3d-app/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  go-backend:
    name: Go Backend (Vet & Test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nequ3d-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: nequ3d-app/go.mod
          cache-dependency-path: nequ3d-app/go.sum
      - name: Prepare placeholder frontend/dist for go:embed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          Set-Content -Path frontend/dist/index.html -Value "<!doctype html><html></html>"
      - run: go vet .
      - run: go test -v . ./pkg/... ./pipeline_rpc/...

  python-core:
    name: Python Core (Syntax & Offline Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nequ3d-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m py_compile process_usd_file.py rpc_server.py otel_setup.py provenance_intoto.py integrity.py omniverse_export.py twin_manifest.py usd_layers.py ../experiments/ntc_thesis_notebook.py
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s . -p "test_*.py" -v

  helm-lint:
    name: Helm, Kyverno, Tetragon, KEDA & Trivy SBOM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v5
      - name: Lint Helm chart (default + KEDA enabled)
        run: |
          helm lint helm/nequ3d-core
          helm lint helm/nequ3d-core --set keda.enabled=true --set keda.natsJetStream.enabled=true
      - name: Enforce Kyverno policies, Tetragon eBPF shield & generate CycloneDX SBOM
        run: |
          pip install pyyaml
          python scripts/verify-netsecops.py
      - name: Run Trivy K8s Misconfiguration & CycloneDX SBOM Scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          mkdir -p /tmp/k8s-audit
          helm template nequ3d-core helm/nequ3d-core --set keda.enabled=true > /tmp/k8s-audit/nequ3d-core.yaml
          cp gitops/apps/jaeger-standalone.yaml /tmp/k8s-audit/
          cp gitops/apps/minio-standalone.yaml /tmp/k8s-audit/
          trivy config --severity CRITICAL --exit-code 1 /tmp/k8s-audit
          trivy fs --scanners vuln --format cyclonedx --output /tmp/nequ3d-trivy.cdx.json .
