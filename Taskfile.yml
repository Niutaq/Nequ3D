version: "3"

tasks:
  proto:
    desc: Generates ProtoBuf files for Go and Python (Cross-platform)
    cmds:
      - cmd: pwsh -File ./scripts/gen_proto.ps1
        platforms: [windows]
      - cmd: bash ./scripts/gen_proto.sh
        platforms: [linux, darwin]

  build-core:
    desc: Builds the Docker image for the processing core
    dir: processing
    cmds:
      - docker build -t nequ3d-core:latest .

  run-core:
    desc: Starts the Python gRPC server locally (Requires a separate terminal!)
    dir: processing
    cmds:
      - cmd: ./venv/Scripts/python rpc_server.py
        platforms: [windows]
      - cmd: ./venv/bin/python rpc_server.py
        platforms: [linux, darwin]

  dev-app:
    desc: Generates Wails bindings and starts the Wails dev server
    dir: nequ3d-app
    cmds:
      - wails3 generate bindings
      - wails3 dev

  dev:
    desc: Prepares everything and starts the dev server (builds core, generates proto, runs app)
    cmds:
      - task: run-core
      - task: dev-app

  # build-locate:
  #   desc: Builds the Docker image for the LocateAnything microservice
  #   dir: ml-services/locate-anything
  #   cmds:
  #     - docker build -t nequ3d-locate:latest .

  # run-locate:
  #   desc: Runs the LocateAnything microservice using Docker (Requires GPU)
  #   cmds:
  #     - docker run --rm --gpus all -v "{{.ROOT_DIR}}/data/hf_cache:/root/.cache/huggingface" -p 8000:8000 nequ3d-locate:latest

  gitops-install:
    desc: Installs ArgoCD to the active Kubernetes cluster
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      - echo "Waiting for ArgoCD server to be ready..."
      - kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s

  gitops-apply:
    desc: Deploys the Nequ3D Core application via ArgoCD (GitOps)
    cmds:
      - kubectl apply -f gitops/apps/nequ3d-core.yaml
      - echo "ArgoCD application created. It will automatically deploy the Helm chart from the repo."

  gitops-password:
    desc: Retrieves the initial admin password for ArgoCD UI (Username is 'admin')
    cmds:
      - cmd: pwsh -Command "[System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String((kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}')))"
        platforms: [windows]
      - cmd: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d && echo ""
        platforms: [linux, darwin]

  gitops-ui:
    desc: Port-forwards the ArgoCD UI to localhost:8080 (CTRL+C to stop)
    cmds:
      - echo "Open https://localhost:8080 in your browser. Username is 'admin'."
      - kubectl port-forward svc/argocd-server -n argocd 8080:443

  monitoring-ui:
    desc: Port-forwards the Grafana UI to localhost:3000 (CTRL+C to stop)
    cmds:
      - echo "Open http://localhost:3000 in your browser. Default login is usually admin / prom-operator."
      - kubectl port-forward svc/kube-prometheus-stack-grafana -n monitoring 3000:80

  run-all:
    desc: Builds Core, generates ProtoBufs and starts Wails App
    cmds:
      - task: proto
      - task: build-core
      - task: dev-app
