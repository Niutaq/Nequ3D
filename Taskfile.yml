version: "3"

tasks:
  proto:
    desc: Generates ProtoBuf files for Go and Python (Cross-platform)
    cmds:
      - cmd: pwsh -File ./scripts/gen_proto.ps1
        platforms: [windows]
      - cmd: bash ./scripts/gen_proto.sh
        platforms: [linux, darwin]

  build-core:
    desc: Builds the Core image (docker or podman; override with NEQU3D_CONTAINER_CLI)
    cmds:
      - pwsh -NoProfile -File ./scripts/container.ps1 build -t nequ3d-core:v4 ./nequ3d-core

  run-core:
    desc: Starts the Python gRPC server locally (Requires a separate terminal!)
    cmds:
      - cmd: pwsh -NoProfile -File ./scripts/container.ps1 run-core
        platforms: [windows, linux, darwin]

  dev-app:
    desc: Generates Wails bindings and starts the Wails dev server
    dir: nequ3d-app
    cmds:
      - wails3 generate bindings
      - wails3 dev

  dev:
    desc: Alias for run-all (Windows desktop + Core + MinIO forwarding)
    cmds:
      - task: run-all

  build-locate:
    desc: Builds the Docker image for the LocateAnything microservice
    cmds:
      - pwsh -NoProfile -File ./scripts/container.ps1 build -t nequ3d-locate:latest ./ml-services/locate-anything

  run-locate:
    desc: Runs LocateAnything on :8000 (GPU; shares VRAM with Core — prefer one heavy job at a time)
    cmds:
      - pwsh -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.ROOT_DIR}}/data/hf_cache' | Out-Null; & ./scripts/container.ps1 cli run --rm --gpus all --name nequ3d-locate-dev --mount ('type=bind,source=' + (Join-Path '{{.ROOT_DIR}}' 'data/hf_cache') + ',target=/root/.cache/huggingface') -p 127.0.0.1:8000:8000 nequ3d-locate:latest"

  run-all-locate:
    desc: Full Windows session including LocateAnything (extra GPU VRAM)
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -File ./scripts/run-all.ps1 -WithLocate

  gitops-install:
    desc: Installs ArgoCD to the active Kubernetes cluster
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      - echo "Waiting for ArgoCD server to be ready..."
      - kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s

  minio-proxy:
    desc: Port-forwards MinIO to localhost for local Wails development
    cmds:
      - kubectl port-forward svc/minio 9000:9000 -n minio

  gitops-apply:
    desc: Deploys the Nequ3D Core application via ArgoCD (GitOps)
    cmds:
      - kubectl apply -f gitops/apps/nequ3d-core.yaml
      - echo "ArgoCD application created. It will automatically deploy the Helm chart from the repo."

  gitops-password:
    desc: Retrieves the initial admin password for ArgoCD UI (Username is 'admin')
    cmds:
      - cmd: pwsh -Command "[System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String((kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}')))"
        platforms: [windows]
      - cmd: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d && echo ""
        platforms: [linux, darwin]

  gitops-ui:
    desc: Port-forwards the ArgoCD UI to localhost:8080 (CTRL+C to stop)
    cmds:
      - echo "Open https://localhost:8080 in your browser. Username is 'admin'."
      - kubectl port-forward svc/argocd-server -n argocd 8080:443

  monitoring-ui:
    desc: Port-forwards the Grafana UI to localhost:3000 (CTRL+C to stop)
    cmds:
      - echo "Open http://localhost:3000 in your browser. Default login is usually admin / prom-operator."
      - kubectl port-forward svc/kube-prometheus-stack-grafana -n monitoring 3000:80

  prometheus-ui:
    desc: Port-forwards the Prometheus UI to localhost:9090 (CTRL+C to stop)
    cmds:
      - echo "Open http://localhost:9090 in your browser."
      - kubectl port-forward -n monitoring svc/kube-prometheus-stack-prometheus 9090:9090

  jaeger-ui:
    desc: Port-forwards Jaeger UI (:16686) and OTLP HTTP collector (:4318) (CTRL+C to stop)
    cmds:
      - echo "Open http://localhost:16686 in your browser (OTLP HTTP on :4318)."
      - kubectl port-forward -n monitoring svc/jaeger 16686:16686 4318:4318

  minio-console:
    desc: Port-forwards the MinIO Web Console to localhost:9001 (CTRL+C to stop)
    cmds:
      - echo "Open http://localhost:9001 in your browser. Login using credentials from minio-standalone.yaml"
      - kubectl port-forward svc/minio -n minio 9001:9001

  run-all:
    desc: One-shot Windows session — MinIO, Core GPU, Wails, Argo/Grafana/Prometheus/Jaeger UIs (use -NoStack to skip CNCF UIs)
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -File ./scripts/run-all.ps1 -WithStack

  run-all-build:
    desc: Rebuilds nequ3d-core:v4 image (-BuildCore) and starts full Windows session with CNCF UIs
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -File ./scripts/run-all.ps1 -WithStack -BuildCore

  run-all-lite:
    desc: Same as run-all but without Argo/Grafana/Prometheus/Jaeger port-forwards
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -File ./scripts/run-all.ps1 -NoStack

  run-all-lite-build:
    desc: Rebuilds nequ3d-core:v4 image (-BuildCore) and starts lite Windows session (-NoStack)
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -File ./scripts/run-all.ps1 -NoStack -BuildCore

  benchmark-sweep:
    desc: Runs multi-BPP NVIDIA RTX NTC benchmark sweep (2, 4, 5, 6 BPP) for the thesis
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -File ./experiments/run-ntc-benchmark.ps1 -BppList "2,4,5,6" -StepsList "150,450"

  notebook:
    desc: Opens the reactive marimo thesis benchmark & LaTeX table notebook (auto-installs marimo into data/marimo-venv if missing)
    cmds:
      - cmd: pwsh -NoProfile -File ./scripts/run-notebook.ps1 -Mode edit
        platforms: [windows]
      - cmd: python3 -m marimo edit ./experiments/ntc_thesis_notebook.py
        platforms: [linux, darwin]

  notebook-view:
    desc: Opens the marimo thesis benchmark notebook in read-only presentation app mode
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -File ./scripts/run-notebook.ps1 -Mode run

  oras-dryrun:
    desc: Validates OCI / ORAS artifact layers and in-toto provenance bundle (pass TWIN_DIR=...)
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -File ./scripts/push-oras-twin.ps1 -TwinDir "{{.TWIN_DIR}}" -DryRun
