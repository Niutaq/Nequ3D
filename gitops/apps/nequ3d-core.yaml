apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nequ3d-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Niutaq/Nequ3D.git'
    path: 'helm/nequ3d-core'
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
