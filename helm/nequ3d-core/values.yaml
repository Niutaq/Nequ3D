replicaCount: 1

# Kubernetes secrets are namespace-scoped: provision this in the Core namespace.
minio:
  existingSecret: minio-credentials

image:
  repository: nequ3d-core
  pullPolicy: IfNotPresent
  tag: "v4"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 50051

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 12Gi
    # Uncomment on GPU-enabled Kubernetes nodes (NVIDIA Device Plugin):
    # nvidia.com/gpu: 1

# CNCF KEDA event-driven autoscaling (scales GPU Core pods 0 -> N on gRPC load or NATS JetStream queue)
keda:
  enabled: false
  pollingInterval: 10
  cooldownPeriod: 120
  minReplicaCount: 0
  maxReplicaCount: 4
  prometheus:
    serverAddress: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
    query: "sum(nequ3d_active_grpc_requests)"
    threshold: "1"
  natsJetStream:
    enabled: false
    natsServerMonitoringEndpoint: "nats.nequ3d.svc.cluster.local:8222"
    account: "$G"
    stream: "NEQU3D_TWIN_EVENTS"
    consumer: "nequ3d-core-workers"
    lagThreshold: "2"

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: "nequ3d.local"
      paths:
        - path: /
          pathType: Prefix
